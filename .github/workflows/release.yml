name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.19.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Check version and extract release notes
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Expected a version tag such as v0.19.1, got ${tag}`);
          }
          const version = tag.slice(1);
          for (const dir of ['.', 'packages/core', 'packages/daemon', 'packages/desktop', 'packages/protocol']) {
            const pkg = JSON.parse(readFileSync(`${dir}/package.json`, 'utf8'));
            if (pkg.version !== version) throw new Error(`${dir}: ${pkg.version} does not match ${tag}`);
          }

          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex((line) => line === `## ${version}` || line.startsWith(`## ${version} — `));
          if (start === -1) throw new Error(`CHANGELOG.md has no entry for ${version}`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, next === -1 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`CHANGELOG.md entry for ${version} is empty`);
          // In macOS, Windows, Linux order: GitHub lists the assets themselves by name.
          const download = (name) => `[${name}](https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name})`;
          const installers = [
            ['macOS · Apple Silicon', `Antumi-${version}-macos-arm64.dmg`],
            ['macOS · Intel', `Antumi-${version}-macos-x64.dmg`],
            ['Windows · x64', `Antumi-${version}-windows-x64.exe`],
            ['Linux · x64（AppImage）', `Antumi-${version}-linux-x86_64.AppImage`],
            ['Linux · x64（deb）', `Antumi-${version}-linux-amd64.deb`]
          ].map(([system, name]) => `| ${system} | ${download(name)} |`).join('\n');
          writeFileSync('release-notes.md', `${notes}\n\n### 安装包\n\n| 平台 | 下载 |\n| --- | --- |\n${installers}\n\nmacOS 若提示无法打开，到「系统设置 → 隐私与安全性」点「仍要打开」；Windows 被 SmartScreen 拦住时，点「更多信息 → 仍要运行」；Linux 的 AppImage 需先 \`chmod +x\`，Ubuntu 22.04 及以上还要装 libfuse2。\n`);
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\nprerelease=${version.includes('-')}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # The backend the app installs on another Linux machine, a WSL distro or an SSH host (docs/WSL.md,
  # docs/REMOTE.md), for each architecture a server may have. Compile on the supported baseline:
  # node-pty compiled against a newer glibc does not load on a machine with an older one.
  linux-backend:
    needs: verify
    name: Linux backend ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    timeout-minutes: 20
    env:
      CC: gcc-10
      CXX: g++-10
      # node-gyp's gyp asks for Python 3.9 or later; the image's python3 is 3.8.
      npm_config_python: /usr/bin/python3.9
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3.9 make gcc-10 g++-10
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      # The runner's user owns the checkout and the container runs as root: git refuses the folder
      # in later steps (bundle-backend.mjs asks it for the commit) unless told it is safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On this container's glibc, whatever the cache restored: bundle-backend.mjs checks the result.
      - run: pnpm rebuild node-pty
      - run: node packages/desktop/scripts/bundle-backend.mjs --platform linux --linux-backend
      - run: node packages/desktop/scripts/pack-linux-backend.mjs
      - run: node packages/desktop/scripts/smoke-linux-backend.mjs packages/desktop/build/linux-backend/backend-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-backend-${{ matrix.arch }}
          path: packages/desktop/build/linux-backend/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [verify, linux-backend]
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            command: dist:mac
            artifact: packages/desktop/dist/Antumi-*-macos-*.dmg
          - platform: windows-x64
            runner: windows-2025
            command: dist:win
            artifact: packages/desktop/dist/Antumi-*-windows-x64.exe
          # node-pty has no Linux prebuild: install compiles it here, with the runner's toolchain.
          - platform: linux-x64
            runner: ubuntu-24.04
            command: dist:linux
            artifact: |
              packages/desktop/dist/Antumi-*-linux-*.AppImage
              packages/desktop/dist/Antumi-*-linux-*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm rebuild node-pty
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-backend-*
          merge-multiple: true
          path: packages/desktop/build/linux-backend
      - if: runner.os == 'Linux'
        name: Check the remote backend on Ubuntu 24.04
        run: node packages/desktop/scripts/smoke-linux-backend.mjs packages/desktop/build/linux-backend/backend-linux-x64.tar.gz
      # electron-builder fetches Electron and its packaging tools from GitHub releases once, without
      # retrying; a 504 there failed a whole release, so the build gets a few spaced tries.
      - name: Build installer
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            pnpm ${{ matrix.command }} && exit 0
            echo "::warning::build attempt $attempt failed"
            sleep $((attempt * 60))
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Publish release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Antumi $RELEASE_TAG" --notes-file release-files/release-notes.md
          fi
          # Lets an app that reads the releases feed (the API refused it) verify the installer.
          (cd release-files && sha256sum *.dmg *.exe *.AppImage *.deb > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-files/*.dmg release-files/*.exe release-files/*.AppImage release-files/*.deb release-files/SHA256SUMS --clobber
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest" \
            --title "Antumi $RELEASE_TAG" --notes-file release-files/release-notes.md
